function formPage({sub,title,body,num}){
  return `<section class="page"><div class="hd"><div class="ann">الملحق ٠١ · متابعة البرامج والتوثيق</div><img src="${MOE_LOGO}" alt="وزارة التعليم"></div>
  <div class="ttl"><div><small>${esc(sub)}</small><h1>${title}</h1></div><div class="ul"></div></div>
  <div style="flex:1;min-height:0;display:flex;flex-direction:column">${body}</div>
  <div class="ft"><b>${SCHOOL}</b><span>إعداد: لجنة التميز · الخطة التشغيلية للعام الدراسي ١٤٤٨هـ${num?` · ${num}`:""}</span></div></section>`;
}
function formDoc(title,pages){
  return `<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"><style>${FORM_CSS}</style></head>
<body><div class="bar-top">${esc(title)} <button type="button" onclick="window.print()">طباعة / حفظ PDF</button></div>${pages.join("")}</body></html>`;
}
async function saveForm(name,html){
  if(!S.dl){ toast("التنزيل غير متاح هنا"); return; }
  try{ await S.dl.save({filename:`${name}-${todayISO}.html`,data:html}); toast("حُفظ النموذج، افتحيه واطبعيه أو احفظيه PDF"); }catch(e){ dlErr(e); }
}
const chk = (on,label,color) => `<span class="chk" style="color:${color||"#2B3A47"}"><i>${on?"✓":""}</i>${label}</span>`;
const val = (v,ph) => v?esc(v):`<span class="dots">${ph||"…………………"}</span>`;

/* ----- (١) تقرير المتابعة الدوري ----- */
function fuPage(p,fu){
  const g=goalOf(p), st=fu.status||progStatus(p), v=progPct(p), on=Math.round(v/10);
  const t=toNum(p.target), a=toNum(fu.achieved); const diff=(t!==null&&a!==null)?(a-t):null;
  const diffS=diff===null?"":(diff>0?"+":"")+new Intl.NumberFormat("ar-SA",{maximumFractionDigits:2}).format(diff);
  return formPage({sub:"نموذج يُعبّأ شهريًا أو فصليًا لكل برنامج",title:"تقرير المتابعة الدوري لبرنامج",body:`
  <div class="g" style="grid-template-columns:2.3fr .8fr 1.7fr 1.2fr 1.2fr">
    <div class="box"><span class="l">اسم البرنامج</span><div class="v" style="font-weight:700;font-size:14px">${esc(p.name)}</div></div>
    <div class="box"><span class="l">رمز الهدف</span><div class="v code">${esc(g.full)}</div></div>
    <div class="box"><span class="l">مسؤولة التنفيذ</span><div class="v">${esc((p.lead||[]).join("، "))}</div></div>
    <div class="box"><span class="l">تاريخ المتابعة</span><div class="v">${hy(fu.date)}</div></div>
    <div class="box"><span class="l">فترة المتابعة</span><div class="v">${chk(fu.period!=="quarterly","شهريًا")}${chk(fu.period==="quarterly","فصلية")}</div></div>
  </div>
  <div class="g" style="grid-template-columns:1fr 1fr">
    <div class="box"><span class="l">نسبة الإنجاز (طُلِّل حتى النسبة المتحققة) · ${nn.format(v)}٪</span><div class="scale">${Array.from({length:10},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("")}</div><div class="scale-l"><span>٠</span><span>٢٥</span><span>٥٠</span><span>٧٥</span><span>١٠٠</span></div></div>
    <div class="box"><span class="l">حالة التنفيذ</span><div class="v" style="display:flex;flex-wrap:wrap;gap:4px 0;margin-top:6px">${Object.entries(PST).map(([k,l])=>chk(st===k,l,PST_C[k])).join("")}</div></div>
  </div>
  <div class="g" style="grid-template-columns:1fr 1fr;flex:1;min-height:0">
    <div class="box" style="overflow:hidden"><span class="l">ما تم إنجازه (مع أرقام الشواهد)</span><div class="v" style="font-size:11.5px">${esc(fu.done||"")}</div></div>
    <div class="box" style="overflow:hidden"><span class="l">أبرز التحديات وفرص التحسين</span><div class="v" style="font-size:11.5px">${esc(fu.challenges||"")}</div></div>
  </div>
  <div class="g" style="grid-template-columns:1fr 1fr">
    <table><thead><tr><th>مؤشر البرنامج</th><th>المستهدف</th><th>المتحقق</th><th>الفرق</th></tr></thead><tbody>
      <tr><td style="font-size:10.5px">${esc(p.indicator||"")}</td><td class="c nw">${esc(p.target||"")}</td><td class="c nw">${esc(fu.achieved||"")}</td><td class="c nw" style="font-weight:700;color:${diff===null?"inherit":diff>=0?"#2E8B57":"#B03A48"}"><bdi dir="ltr">${diffS}</bdi></td></tr>
      <tr><td>خط الأساس</td><td class="c nw" colspan="3">${esc(p.baseline||"")}</td></tr></tbody></table>
    <div class="box"><span class="l">الإجراء التصحيحي المطلوب</span><div class="v">${esc(fu.corrective||"")}</div>
      <div class="v" style="margin-top:6px;font-size:12px">المسؤولة: ${val(fu.corrResp)}&nbsp;&nbsp;&nbsp; موعد الإنجاز: ${fu.corrDue?hy(fu.corrDue):"……/……/١٤٤٨هـ"}</div></div>
  </div>
  <div class="g" style="grid-template-columns:repeat(4,1fr);margin-bottom:8px">
    <div class="box sig"><span class="l">المتابِعة (الاسم والتوقيع)</span><div class="v">${esc(fu.follower||"")}</div></div>
    <div class="box sig"><span class="l">موعد المتابعة القادمة</span><div class="v">${fu.next?hy(fu.next):""}</div></div>
    <div class="box sig"><span class="l">اعتماد رئيسة فريق المتابعة</span></div>
    <div class="box sig"><span class="l">اطلاع مديرة المدرسة</span><div class="v">ريم العثيم</div></div>
  </div>`});
}
function openFollowup(pid){
  const p=progById(pid)||S.programs[0]; if(!p) return;
  const fu={...fuDefaults(p),...(p.fu||{})}; if(!fu.done) fu.done=fuDefaults(p).done; const ro=!S.canWrite;
  modalRoot.innerHTML=`<div class="modal-back" data-close="1"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="fuT">
    <h2 id="fuT"><span class="sec-ic" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)">${ic("report")}</span>تقرير المتابعة الدوري</h2>
    <form class="form" id="fuForm">
      <label class="full">البرنامج<select id="fu-prog">${S.programs.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select></label>
      <label>فترة المتابعة<select id="fu-period"><option value="monthly">شهرية</option><option value="quarterly">فصلية</option></select></label>
      <label>تاريخ المتابعة<input type="date" id="fu-date" value="${fu.date}"></label>
      <label>حالة التنفيذ<select id="fu-status"><option value="">تلقائي: ${PST[progStatus(p)]}</option>${Object.entries(PST).map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></label>
      <label>نسبة الإنجاز<input type="text" value="${n(progPct(p))}٪ (محسوبة من المهام)" disabled></label>
      <label class="full">ما تم إنجازه (مع أرقام الشواهد) <button type="button" class="btn sm" id="fu-auto" style="align-self:flex-start">${ic("spark")} تعبئة من المهام والشواهد</button><textarea id="fu-done" rows="5">${esc(fu.done)}</textarea></label>
      <label class="full">أبرز التحديات وفرص التحسين<textarea id="fu-ch" rows="3">${esc(fu.challenges)}</textarea></label>
      <label>المتحقق من المؤشر<input type="text" id="fu-ach" value="${esc(fu.achieved)}" placeholder="المستهدف: ${esc(p.target||"")}"></label>
      <label>المتابِعة<input type="text" id="fu-fol" value="${esc(fu.follower)}" list="ppl-fu"></label>
      <label class="full">الإجراء التصحيحي المطلوب<textarea id="fu-cor" rows="2">${esc(fu.corrective)}</textarea></label>
      <label>مسؤولة الإجراء<input type="text" id="fu-cres" value="${esc(fu.corrResp)}" list="ppl-fu"></label>
      <label>موعد إنجاز الإجراء<input type="date" id="fu-cdue" value="${fu.corrDue}"></label>
      <label>موعد المتابعة القادمة<input type="date" id="fu-next" value="${fu.next}"></label>
      <datalist id="ppl-fu">${[...new Set(S.tasks.flatMap(people))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
    </form>
    <div class="modal-foot"><button class="btn primary" id="fu-go" type="button">${ICON.dl} ${ro?"تصدير التقرير":"حفظ وتصدير التقرير"}</button>${ro?"":`<button class="btn" id="fu-save" type="button">${ic("check")} حفظ فقط</button>`}<span class="sp"></span><button class="btn" data-close="1" type="button">إغلاق</button></div>
  </div></div>`;
  const $=s=>modalRoot.querySelector(s);
  modalRoot.querySelectorAll('input[type="date"]').forEach(inp=>{ const hn=Object.assign(document.createElement("span"),{className:"hint"}); const u=()=>hn.textContent=inp.value?hl(inp.value):""; inp.after(hn); inp.addEventListener("input",u); u(); });
  $("#fu-period").value=fu.period; $("#fu-status").value=fu.status||"";
  $("#fu-prog").onchange=e=>openFollowup(e.target.value);
  $("#fu-auto").onclick=()=>{ $("#fu-done").value=fuDefaults(p).done; };
  const read=()=>({period:$("#fu-period").value,date:$("#fu-date").value||todayISO,status:$("#fu-status").value,done:$("#fu-done").value.trim(),challenges:$("#fu-ch").value.trim(),achieved:$("#fu-ach").value.trim(),
    corrective:$("#fu-cor").value.trim(),corrResp:$("#fu-cres").value.trim(),corrDue:$("#fu-cdue").value,follower:$("#fu-fol").value.trim(),next:$("#fu-next").value});
  const save=async f=>{ if(!S.db||!S.canWrite) return false; try{ await S.db.doc("programs/"+p.id).update({fu:f}); return true; }catch(e){ handleWriteErr(e); return false; } };
  $("#fu-save")?.addEventListener("click",async()=>{ if(await save(read())) toast("حُفظت بيانات المتابعة"); });
  $("#fu-go").onclick=async()=>{ const f=read(); if(!ro) await save(f); await saveForm(`تقرير-المتابعة-الدوري-${p.name}`,formDoc(`تقرير المتابعة الدوري · ${p.name}`,[fuPage(p,f)])); };
}

/* ----- (٢) بطاقة توثيق شاهد ----- */
async function evDataUrl(e){
  if(e.link||!/^image\//.test(e.type||"")) return "";
  try{ let b; if(S.as?.blob) b=await S.as.blob(e.id); else { const r=await fetch("/_blob/"+e.id); if(!r.ok) throw 0; b=await r.blob(); }
    return `data:${e.type};base64,${await blobToB64(b)}`; }catch(_){ return ""; }
}
function cardPage(p,x,img){
  const e=x.e, c=evCode(p,x);
  const slot=img?`<img src="${img}" alt="" style="max-width:100%;max-height:100%;object-fit:contain;border-radius:6px">`
    :`<div style="text-align:center;color:#8A9AA5"><div style="font-size:34px">${e.link?"🔗":(e.type==="application/pdf"?"📄":"🖼️")}</div><b style="display:block;color:#5E707C;font-size:15px;margin:4px 0">${e.link?"شاهد على رابط":e.type==="application/pdf"?"ملف PDF مرفق":"موضع الشاهد"}</b><div style="font-size:11.5px;direction:ltr;word-break:break-all">${esc(e.link||e.name||"")}</div></div>`;
  const nb=(v,l)=>`<div style="text-align:center"><div style="border:1px solid #9CC4E4;border-radius:7px;background:#fff;height:30px;min-width:66px;display:grid;place-items:center;font-weight:800;color:#2781BE;font-size:15px">${esc(v)}</div><div style="font-size:10px;color:#5E707C;margin-top:3px">${l}</div></div>`;
  return formPage({sub:"تُرفق مع كل شاهد",title:"نموذج (٢): بطاقة توثيق شاهد",body:`
  <div style="display:grid;grid-template-columns:1.2fr 1fr;gap:10px;flex:1;min-height:0;margin-bottom:8px">
    <div style="display:flex;flex-direction:column;gap:6px;min-height:0">
      <div class="box"><span class="l">اسم البرنامج</span><div class="v" style="font-weight:700">${esc(p.name)}</div></div>
      <div class="box"><span class="l">الهدف العام</span><div class="v" style="font-size:11.5px">${esc(p.strategic||"")}</div></div>
      <div class="box"><span class="l">الهدف التفصيلي</span><div class="v" style="font-size:11.5px">${esc(p.operational||"")}</div></div>
      <div class="box"><span class="l">مؤشر الإنجاز</span><div class="v" style="font-size:11.5px">${esc(p.indicator||"")}</div></div>
      <div class="box" style="flex:1;overflow:hidden"><span class="l">وصف الشاهد</span><div class="v">${esc(e.desc||x.t.title)}</div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div class="box"><span class="l">تاريخ التنفيذ</span><div class="v">${hy(e.date||e.at)}</div></div><div class="box"><span class="l">الفئة المستفيدة وعددها</span><div class="v" style="font-size:11.5px">${esc(e.benef||p.audience||"")}</div></div></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px;min-height:0">
      <div class="box" style="background:#EEF5FB;border-color:#9CC4E4"><span class="l" style="color:#123B5A">رقم الشاهد</span><div style="display:flex;justify-content:center;gap:8px;align-items:flex-start">${nb(c.gen,"الهدف العام")}<b style="color:#9CC4E4;margin-top:6px">/</b>${nb(c.det,"الهدف التفصيلي")}<b style="color:#9CC4E4;margin-top:6px">/</b>${nb(c.ind,"مؤشر الإنجاز")}<b style="color:#9CC4E4;margin-top:6px">/</b>${nb(c.seq,"الشاهد")}</div></div>
      <div style="flex:1;min-height:0;border:1.5px dashed #BFD9DE;border-radius:9px;background:#F6F9FA;display:grid;place-items:center;padding:8px;overflow:hidden">${slot}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div class="box sig" style="min-height:44px"><span class="l">مسؤولة البرنامج (الاسم والتوقيع)</span><div class="v" style="font-size:11.5px">${esc((p.lead||[]).join("، "))}</div></div><div class="box sig" style="min-height:44px"><span class="l">اعتماد رئيسة فريق المتابعة</span></div></div>
    </div>
  </div>`});
}
async function exportCards(p,list){
  if(!list.length){ toast("لا توجد شواهد لهذا البرنامج بعد"); return; }
  toast("جارٍ تجهيز بطاقات التوثيق…");
  const pages=[]; for(const x of list) pages.push(cardPage(p,x,await evDataUrl(x.e)));
  await saveForm(list.length===1?`بطاقة-توثيق-شاهد-${evCodeStr(evCode(p,list[0])).replace(/ \/ /g,"-")}`:`بطاقات-توثيق-الشواهد-${p.name}`,formDoc(`بطاقة توثيق شاهد · ${p.name}`,pages));
}

      <label>سبب التصنيف<input type="text" id="ed-why" value="${esc(e.rateWhy||"")}" ${ro?"disabled":""}></label>

    <div class="modal-foot"><button class="btn primary" id="ed-go" type="button">${ICON.dl} ${ro?"تصدير البطاقة":"حفظ وتصدير البطاقة"}</button>${ro?"":`<button class="btn" id="ed-sv" type="button">${ic("check")} حفظ فقط</button>`}<span class="sp"></span><button class="btn" type="button" id="ed-back">رجوع</button></div>
  </div></div>`;
  const $=s=>modalRoot.querySelector(s);

const FB_VER="10.12.2";
const loadScript = src => new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>bad(new Error(src)); document.head.appendChild(s); });
const fbErr = e => { const c=e?.code||""; throw {code: c==="permission-denied"||c==="unauthenticated"?"invalid_argument":c==="resource-exhausted"?"quota_exceeded":"unavailable", message:e?.message||""}; };
function fbAdapter(fs){
  const docA = r => ({
    id:r.id, path:r.path,
    get:()=>r.get().then(s=>({id:s.id,exists:s.exists,data:()=>s.data()}),fbErr),
    set:d=>r.set(d).catch(fbErr),
    update:d=>r.set(d,{merge:true}).catch(fbErr),
    delete:()=>r.delete().catch(fbErr),
    onSnapshot:(next,err)=>r.onSnapshot(s=>next({id:s.id,exists:s.exists,data:()=>s.data()}),e=>err&&err({code:"unavailable",message:e.message}))
  });
  const q = (r,ref) => ({
    orderBy:(f,dir)=>q(r.orderBy(f,dir||"asc"),ref),
    onSnapshot:(next,err)=>r.onSnapshot(s=>next({docs:s.docs.map(x=>({id:x.id,exists:true,data:()=>x.data()})),size:s.size,empty:s.empty}),e=>err&&err({code:"unavailable",message:e.message})),
    add:d=>ref.add(d).then(x=>docA(x),fbErr),
    doc:id=>docA(id?ref.doc(id):ref.doc())
  });
  return { collection:n=>{ const ref=fs.collection(n); return q(ref,ref); }, doc:p=>docA(fs.doc(p)) };
}
const b64ToBlob=(b64,type)=>{ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type}); };
const blobToB64=b=>new Promise((ok,bad)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(",")[1]); r.onerror=bad; r.readAsDataURL(b); });
async function shrinkImage(file){
  if(!/^image\/(png|jpeg|webp)$/.test(file.type)) return file;
  const bmp=await createImageBitmap(file); let out=file;
  for(const [mx,qq] of [[1600,.8],[1280,.7],[1000,.6],[800,.55]]){
    const k=Math.min(1,mx/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(bmp,0,0,c.width,c.height);
    out=await new Promise(ok=>c.toBlob(ok,"image/jpeg",qq)); if(out.size<=700*1024) break;
  }
  return out;
}
function fbAssets(fs){
  const col=fs.collection("evidence");
  return {
    async upload(file,opts){
      let blob=await shrinkImage(file); const type=blob===file?(opts?.type||file.type):"image/jpeg";
      if(blob.size>700*1024) throw {code:"too_large"};
      const data=await blobToB64(blob);
      const ref=await col.add({name:file.name,type,size:blob.size,data,at:todayISO,by:S.uid||""}).catch(fbErr);
      S.evCache[ref.id]=`data:${type};base64,${data}`;
      return {id:ref.id,url:S.evCache[ref.id],sizeBytes:blob.size,contentType:type};
    },
    async delete(id){ await col.doc(id).delete().catch(fbErr); delete S.evCache[id]; return {deleted:true}; },
    async blob(id){ const s=await col.doc(id).get(); if(!s.exists) throw {code:"not_found"}; const x=s.data(); return b64ToBlob(x.data,x.type); },
    async src(id){ if(S.evCache[id]) return S.evCache[id]; const s=await col.doc(id).get(); if(!s.exists) return ""; const x=s.data(); return (S.evCache[id]=`data:${x.type};base64,${x.data}`); }
  };
}

    $("#lgHint").textContent=admin?"الدخول بالبريد وكلمة المرور الخاصة بك":"أدخلي رمز الدخول الذي وصلك من إدارة المدرسة"; $("#lgSwitch").textContent=admin?"الدخول برمز المدرسة":"دخول المشرفة أو مسؤولة المتابعة بالبريد"; };
  $("#lgForm").onsubmit=async e=>{ e.preventDefault(); $("#lgErr").textContent=""; $("#lgBtn").disabled=true;
    const email=admin?$("#lg-email").value.trim():(cfg.staffEmail||"staff@khutta.app");
    try{ await auth.signInWithEmailAndPassword(email,$("#lg-code").value); }
    catch(err){ const c=err.code||"";
      $("#lgErr").textContent = /network/.test(c)?"تعذّر الاتصال، تأكدي من الإنترنت"
        :/unauthorized-domain/.test(c)?"هذا الرابط غير مسموح في Firebase بعد: أضيفي "+location.hostname+" في Authentication ← Settings ← Authorized domains"
        :/operation-not-allowed|configuration-not-found/.test(c)?"تسجيل الدخول بالبريد غير مفعّل في Firebase: فعّلي Email/Password في Authentication ← Sign-in method"
        :/too-many-requests/.test(c)?"محاولات كثيرة، انتظري دقائق ثم أعيدي"
        :/user-not-found/.test(c)?(admin?"لا يوجد حساب بهذا البريد في Firebase":"حساب "+email+" غير موجود في Firebase ← Authentication ← Users")
        :/api-key|invalid-api-key/.test(c)?"إعدادات Firebase في config.js غير صحيحة"
        :admin?"البريد أو كلمة المرور غير صحيحة":"رمز الدخول غير صحيح، أو لم يُنشأ حساب "+email+" في Firebase";
      $("#lgErr").title=c; console.warn("login",c); }
    finally{ $("#lgBtn").disabled=false; } };
  setTimeout(()=>$("#lg-code").focus(),50);
}
function askNameIfNeeded(){
  if(S.MODE!=="firebase"||S.isAdmin||S.uid||S.askedName||!S.loaded.t) return;
  S.askedName=true; openWho(true);
}
function openWho(first){
  const all=[...new Set(S.tasks.flatMap(people))].sort((a,b)=>a.localeCompare(b,"ar"));
  modalRoot.innerHTML=`<div class="modal-back" ${first?"":'data-close="1"'}><div class="modal" role="dialog" aria-modal="true" aria-labelledby="whoT" style="width:min(460px,100%)">
    <h2 id="whoT"><span class="sec-ic" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)">${ic("user")}</span>${first?"أهلًا بك، من أنتِ؟":"حسابي"}</h2>
    <p class="muted" style="margin-top:0">يُسجَّل اسمك مع كل تحديث وشاهد ترفعينه.</p>
    <div class="form"><label class="full" for="who-name">اسمك<input type="text" id="who-name" list="who-list" value="${esc(S.uid||"")}" placeholder="اختاري اسمك أو اكتبيه"></label></div>
    <datalist id="who-list">${all.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>
    <div class="modal-foot"><button class="btn primary" type="button" id="who-save">${ic("check")} حفظ</button>${first?"":`<button class="btn" type="button" data-close="1">إغلاق</button><span class="sp"></span><button class="btn danger" type="button" id="who-out">تسجيل الخروج</button>`}</div>
  </div></div>`;
  const $=s=>modalRoot.querySelector(s);
  $("#who-save").onclick=()=>{ const v=$("#who-name").value.trim(); if(!v){ $("#who-name").focus(); return; } S.uid=v; try{ localStorage.setItem("kh_name",v); }catch(_){} updateWho(); closeModal(); };
  $("#who-out")?.addEventListener("click",()=>{ closeModal(); signOutNow(); });
  setTimeout(()=>$("#who-name").focus(),50);
}
function signOutNow(){ try{ localStorage.removeItem("kh_name"); }catch(_){} S.uid=""; S.fbAuth?.signOut(); toast("تم تسجيل الخروج"); }
document.getElementById("logoutBtn")?.addEventListener("click",signOutNow);
function updateWho(){ const lo=document.getElementById("logoutBtn"); if(lo) lo.hidden=!(S.MODE==="firebase"&&S.db); const b=document.getElementById("whoBtn"); if(!b) return; b.hidden=S.MODE!=="firebase"; b.innerHTML=`${ic("user")}<span>${esc(S.uid||"حسابي")}${S.role==="follower"&&S.uid&&S.uid!=="مسؤولة المتابعة"?" · مسؤولة المتابعة":""}</span>`; }
async function importSeed(btn){
  if(!S.fbStore||!window.KH_SEED) return; btn.disabled=true; btn.textContent="جارٍ الاستيراد…";
  try{ const fs=S.fbStore, sd=window.KH_SEED; const all=[...sd.programs.map(x=>["programs",x]),...sd.tasks.map(x=>["tasks",x]),["settings",{id:"main",...sd.settings}]];
    for(let i=0;i<all.length;i+=400){ const b=fs.batch(); all.slice(i,i+400).forEach(([c,x])=>{ const {id,...rest}=x; b.set(fs.collection(c).doc(id),rest); }); await b.commit(); }
    toast("استُوردت برامج الخطة ومهامها");
  }catch(e){ btn.disabled=false; btn.textContent="إعادة المحاولة"; toast(e?.code==="permission-denied"?"قواعد Firestore تمنع الكتابة، راجعي خطوة القواعد في الدليل":"تعذّر الاستيراد، حاولي مرة أخرى"); }
}
/* واجهة مختصرة تحاكي Firestore compat فوق المكتبة الحديثة */
function fsCompat(FS,db){
  const dsnap=x=>({id:x.id,exists:x.exists(),data:()=>x.data()});
  const qsnap=x=>({docs:x.docs.map(y=>({id:y.id,exists:true,data:()=>y.data()})),size:x.size,empty:x.empty});
  const dref=r=>({id:r.id,path:r.path,_r:r,get:()=>FS.getDoc(r).then(dsnap),set:(d,o)=>FS.setDoc(r,d,o||{}),update:d=>FS.updateDoc(r,d),delete:()=>FS.deleteDoc(r),onSnapshot:(nx,er)=>FS.onSnapshot(r,x=>nx(dsnap(x)),er)});
  const qry=(q,col)=>({orderBy:(f,dir)=>qry(FS.query(q,FS.orderBy(f,dir||"asc")),col),onSnapshot:(nx,er)=>FS.onSnapshot(q,x=>nx(qsnap(x)),er),add:d=>FS.addDoc(col,d).then(dref),doc:id=>dref(id?FS.doc(col,id):FS.doc(col))});
  return {collection:nm=>{ const c=FS.collection(db,nm); return qry(c,c); },doc:p=>dref(FS.doc(db,p)),
    batch:()=>{ const b=FS.writeBatch(db); return {set:(r,d,o)=>{ b.set(r._r,d,o||{}); },commit:()=>b.commit()}; }};
}
async function bootFirebase(){
  S.MODE="firebase"; S.dl=nativeDownloads; S.evCache={};
  const cfg=window.KH_FIREBASE||{};
  if(!cfg.apiKey||/ضعي|YOUR/.test(cfg.apiKey)){ view.innerHTML='<div class="notice"><h2>التطبيق غير مربوط بقاعدة البيانات بعد</h2><p>افتحي ملف config.js وضعي فيه إعدادات مشروع Firebase كما في دليل الإعداد، ثم أعيدي تحميل الصفحة.</p></div>'; return; }
  view.innerHTML='<div class="notice"><h2>جارٍ تحميل الخطة…</h2></div>';
  S.bootStep="تحميل ملفات Firebase";
  const report=m=>{ const el=document.getElementById("bootDiag")||Object.assign(document.createElement("div"),{id:"bootDiag",className:"notice"}); el.innerHTML=`<h2>لم يكتمل فتح التطبيق</h2><p>توقف عند: <b>${esc(S.bootStep)}</b></p><p class="tiny" dir="ltr">${esc(m||"")} · ${esc(navigator.userAgent)}</p><p>أرسلي صورة هذه الرسالة للدعم.</p>`; if(!el.parentNode) view.prepend(el); };
  window.addEventListener("error",e=>report(e.message)); window.addEventListener("unhandledrejection",e=>report(String(e.reason?.message||e.reason)));
  setTimeout(()=>{ if(!S.loaded.p&&!document.getElementById("login")) report("انتهت المهلة"); },20000);
  // مكتبات Firebase الحديثة (modules): تسجيل دخول بلا iframe وبتخزين localStorage حتى لا يعلق Safari على iPhone
  const B=`https://www.gstatic.com/firebasejs/${FB_VER}/`;
  let A,AU,FS;
  try{ [A,AU,FS]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]); }
  catch(e){ view.innerHTML='<div class="notice"><h2>تعذّر تحميل Firebase</h2><p>تأكدي من الاتصال بالإنترنت ثم أعيدي تحميل الصفحة.</p></div>'; return; }
  S.bootStep="تهيئة Firebase";
  const app=A.initializeApp(cfg);
  const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent));
  const authM=AU.initializeAuth(app,{persistence:[AU.browserLocalPersistence,AU.inMemoryPersistence]});
  let dbM; try{ dbM=FS.initializeFirestore(app,{experimentalAutoDetectLongPolling:true,localCache:mobile?FS.memoryLocalCache():FS.persistentLocalCache({tabManager:FS.persistentMultipleTabManager()})}); }
  catch(_){ dbM=FS.initializeFirestore(app,{experimentalAutoDetectLongPolling:true}); }
  const auth={signInWithEmailAndPassword:(e,pw)=>AU.signInWithEmailAndPassword(authM,e,pw),onAuthStateChanged:f=>AU.onAuthStateChanged(authM,f),signOut:()=>AU.signOut(authM)};
  const fs=fsCompat(FS,dbM); S.fbAuth=auth; S.fbStore=fs;
  S.bootStep="التحقق من تسجيل الدخول";
  auth.onAuthStateChanged(u=>{
    S.bootStep=u?"جلب الخطة من قاعدة البيانات":"صفحة الدخول";
    closeModal(); S.askedName=false; (S.unsubs||[]).forEach(f=>f()); S.unsubs=[]; S.loaded={p:false,t:false}; S.programs=[]; S.tasks=[];
    if(!u){ S.db=null; view.innerHTML=""; showLogin(auth,cfg); updateWho(); return; }
    view.innerHTML='<div class="notice"><h2>جارٍ تحميل الخطة…</h2></div>';
    document.getElementById("login")?.remove();
    S.isAdmin = u.email!==(cfg.staffEmail||"staff@khutta.app");
    S.canEditArt=S.isAdmin; S.canWrite=true;
    const acc=(cfg.accounts||{})[String(u.email||"").toLowerCase()]; S.role=S.isAdmin?(acc?.role||"admin"):"staff";
    const defName=S.isAdmin?(acc?.name||cfg.adminName||"المشرفة"):"";
    try{ S.uid=localStorage.getItem("kh_name")||defName; }catch(_){ S.uid=defName; }
    S.db=fbAdapter(fs); S.as=fbAssets(fs); updateWho(); render(); subscribeAll(S.db);
  });
}
(async()=>{ const cl=window.claude; if(cl?.use) await bootClaude(cl); else await bootFirebase(); })();

})();
